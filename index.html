<style>
:root{--bg:#0b0910;--panel:#16121e;--gold:#c9a04a;--text:#ece6f4;--dim:#9a90ab;--red:#e8433a}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Jua,system-ui,sans-serif}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding:12px 16px 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}

.touch{display:none}

  .pad .big{background:rgba(232,67,58,.55)}

}

<script>
// ---------- audio: original orchestral-style music + sound effects, synthesized live with Web Audio ----------
const AU={ctx:null,muted:false,song:null,name:'',step:0,next:0,last:{}};
// sound is always on: unlock audio on the first touch/click/key and keep it running
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
function auUnlock(){auInit();const c=AU.ctx;if(!c)return;if(c.state!=='running')c.resume().catch(()=>{});
  if(!AU.unlocked){AU.unlocked=1;try{const b=c.createBuffer(1,1,22050),s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(0)}catch(e){}
    try{const a=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=');a.setAttribute('playsinline','');a.play().catch(()=>{})}catch(e){}}}
['pointerdown','touchstart','touchend','mousedown','keydown','click'].forEach(t=>addEventListener(t,auUnlock,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&AU.ctx&&AU.ctx.state!=='running')AU.ctx.resume().catch(()=>{})});
const mf=n=>440*Math.pow(2,(n-69)/12);
function makeIR(c,sec,decay){const len=Math.floor(c.sampleRate*sec),b=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
function auBuild(c){
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=4;comp.connect(c.destination);
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:0.9;AU.master.connect(comp);
  AU.rev=c.createConvolver();AU.rev.buffer=makeIR(c,2.8,2.4);AU.rev.connect(AU.master);
  AU.music=c.createGain();AU.music.gain.value=0.34;AU.music.connect(AU.master);
  const ms=c.createGain();ms.gain.value=0.42;AU.music.connect(ms);ms.connect(AU.rev);
  AU.sfx=c.createGain();AU.sfx.gain.value=0.5;AU.sfx.connect(AU.master);
  const ss=c.createGain();ss.gain.value=0.15;AU.sfx.connect(ss);ss.connect(AU.rev);
  const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
}
function auInit(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  let c;try{c=new AC()}catch(e){return}AU.ctx=c;auBuild(c);setInterval(auTick,25);
}
// --- building blocks ---
function out(node,dest,pan){const c=AU.ctx;if(pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=pan;node.connect(p);p.connect(dest||AU.music)}else node.connect(dest||AU.music)}
function env(g,t,v,a,hold,r){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,t+Math.max(a,hold));g.gain.linearRampToValueAtTime(0.0001,t+hold+r)}
function osc(type,f,t,end,detune){const o=AU.ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(detune)o.detune.value=detune;o.start(t);o.stop(end);return o}
function lp(f,q){const b=AU.ctx.createBiquadFilter();b.type='lowpass';b.frequency.value=f;b.Q.value=q||0.7;return b}
function vibrato(o,t,rate,cents,delay){const c=AU.ctx,l=c.createOscillator(),g=c.createGain();l.frequency.value=rate;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(cents,t+delay+0.2);l.connect(g);g.connect(o.detune);l.start(t);l.stop(t+8);}
function noise(t,dur,o){o=o||{};const c=AU.ctx,s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type=o.ft||'highpass';f.frequency.setValueAtTime(o.f||6000,t);
  if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||0.7;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(o.vol||0.2,t+(o.a||0.003));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);out(g,o.dest,o.pan);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02)}
function tone(t,n,dur,o){o=o||{};const c=AU.ctx,g=c.createGain(),f=mf(n),os=osc(o.type||'square',f,t,t+dur+0.1,o.detune);if(o.glide)os.frequency.exponentialRampToValueAtTime(mf(n+o.glide),t+dur);
  let node=os;if(o.cut){const b=lp(o.cut,o.q);os.connect(b);node=b}env(g,t,o.vol||0.2,o.attack||0.005,Math.max(0.01,dur-(o.release||0.06)),o.release||0.06);node.connect(g);out(g,o.dest,o.pan)}
// --- instruments (t, midi note, duration, velocity) ---
const INST={
  flute(t,n,d,v,dest){const c=AU.ctx,g=c.createGain(),f=mf(n),a=osc('sine',f,t,t+d+0.3),b=osc('triangle',f,t,t+d+0.3),bg=c.createGain();bg.gain.value=0.3;
    vibrato(a,t,5.2,9,0.18);vibrato(b,t,5.2,9,0.18);a.connect(g);b.connect(bg);bg.connect(g);env(g,t,v,0.06,d,0.18);out(g,dest,0.05);
    noise(t,0.09,{ft:'bandpass',f:f*2,q:2,vol:v*0.25,dest})},
  horn(t,n,d,v,dest){const c=AU.ctx,g=c.createGain(),f=mf(n),fl=lp(500,1.2);for(const dt of [-5,5]){const o=osc('sawtooth',f,t,t+d+0.4,dt);o.connect(fl)}
    fl.frequency.setValueAtTime(400,t);fl.frequency.linearRampToValueAtTime(1300,t+0.12);fl.frequency.linearRampToValueAtTime(1000,t+d);fl.connect(g);env(g,t,v,0.07,d,0.25);out(g,dest,-0.1)},
  brass(t,n,d,v,dest){const c=AU.ctx,g=c.createGain(),f=mf(n),fl=lp(400,1.5);for(const dt of [-7,0,7]){const o=osc('sawtooth',f,t,t+d+0.3,dt);o.connect(fl)}

// ---------- hit system ----------
function hitbox(att,h){const f=att.face,x0=f>0?att.x+h.off:att.x-h.off-h.w,x1=f>0?att.x+h.off+h.w:att.x-h.off;return[x0,x1]}
function overlaps(att,h,tg){const [x0,x1]=hitbox(att,h);if(tg.x+(tg.T?tg.T.w/2:16)<x0||tg.x-(tg.T?tg.T.w/2:16)>x1)return false;
  if(Math.abs(tg.y-att.y)>(h.dy||30))return false;const zr=h.zr||[-30,95],dz=tg.z-att.z;return dz>=zr[0]&&dz<=zr[1]}
function canHit(e){return e.st!=='dead'&&e.st!=='getup'&&!e.spawnIn}
function applyHit(tg,h,att,opt){
  opt=opt||{};if(tg.st==='down'&&!h.otg&&!opt.ult)return false;
  const crit=Math.random()<0.13+PB.crit;let d=rnd(h.dmg[0],h.dmg[1])*(crit?1.5:1)*(tg.groggy>0?1.35:1)*PB.atk*(tg.type==='boss'?PB.boss:1)*(combo.n>=10?PB.combo:1)*(opt.ult?PB.ult:1);d=Math.round(d);
  tg.hp-=d;tg.hitF=0.09;tg.shk=0.12;
  const f=att?att.face:1,heavy=tg.armor>0&&tg.groggy<=0;
  if(heavy){tg.armor-=d;if(tg.armor<=0){tg.armor=0;tg.groggy=3.2;tg.atk=null;tg.st='groggy';tg.t=0;addNum(tg.x,tg.y,tg.z+tg.T.h+30,'GROGGY',3);sfx('boom');shake=Math.max(shake,14);flash=0.12;flashCol='255,220,140'}}
  else{
    let kx=(h.kx||0)*f,kz=h.kz||0;
    if(h.pull&&att){kx=clamp((att.x-tg.x)*5,-260,260)}
    if(h.carry&&att)kx=f*620;
    const airborne=tg.z>1||tg.st==='air';
    if(tg.type==='boss'){kx*=0.2;kz*=0.35}
    if(airborne){tg.jug++;const dec=Math.max(0.3,1-tg.jug*0.055);tg.vz=Math.max(tg.vz*0.3,(kz||240)*dec);tg.vx=kx*0.55;tg.st='air'}
    else if(kz>0){tg.st='air';tg.vz=kz;tg.vx=kx*0.45;tg.jug=0;tg.z=Math.max(tg.z,1)}
    else if(tg.st==='down'){tg.st='air';tg.vz=200;tg.vx=kx*0.3;tg.z=1}
    else{tg.st='stun';tg.t=h.stun||0.35;tg.vx=kx}
    if(h.bounce)tg.bounce=true;tg.atk=null;
  }
  tg.aggro=true;
  hitstop=Math.max(hitstop,h.hs||0.05);shake=Math.max(shake,h.big?9:3.5);
  combo.n++;combo.t=1.7;combo.dmg+=d;maxCombo=Math.max(maxCombo,combo.n);
  addNum(tg.x,tg.y,tg.z+tg.T.h*0.8,d,crit?2:1);
  hitFx(tg,att,h,crit);
  lastTarget=tg;lastTargetT=3;
  sfx(crit?'crit':'hit',tg.type==='boss'?'boss':(HITMAT[tg.T.cut||tg.type]||'orc'));
  if(tg.hp<=0&&tg.st!=='dead')kill(tg);
  return true;
}
function kill(e){e.hp=0;e.deadPending=true;if(e.st!=='air'){e.st='air';e.vz=320;e.vx=(player.x<e.x?1:-1)*120;e.z=Math.max(e.z,1)}
  if(e.type==='boss'){slowmo=1.6;flash=0.35;flashCol='255,240,200';shake=22;sfx('roar')}}

// ---------- player ----------
function startMove(name){const p=player,M=MOVES[name];p.move=name;p.mt=0;p.hitSets=M.hits.map(()=>new Set());p.st='move';p.queued=null;
  if(M.mp){p.mp-=M.mp;p.cds[name]=M.cd*PB.cdr}
  if(M.sfx)sfx(M.sfx);
  if(name==='skF'){p.slamZ0=p.z}
  if(name==='skQ'){if(p.z<5){p.vz=520;p.z=1}p.diveT=0.16}
  if(M.ult){ultCut=0.75;dark=1}
  if(name==='a1'||name==='a2'||name==='a3'||name==='a4'||name==='air'){const d=(K.R?1:0)-(K.L?1:0);if(d)p.face=d}
}
function skillReady(n){const p=player,M=MOVES[n];return !(p.cds[n]>0)&&p.mp>=M.mp}
function trySkill(){const p=player;for(const n of SKILLS){const k=SKILLKEY[n];if(buffered(k,0.12)){
  if(!skillReady(n)){consume(k);if(p.mp<MOVES[n].mp&&time-(p._mpw||0)>0.8){p._mpw=time;addNum(p.x,p.y,p.z+130,'MP 부족',0)}continue}
  if(n!=='skQ'&&p.z>4&&p.st!=='move')continue;
  consume(k);const d=(K.R?1:0)-(K.L?1:0);if(d)p.face=d;startMove(n);return true}}return false}
function playerUpdate(dt){
  const p=player;p.inv-=dt;for(const n in p.cds)p.cds[n]-=dt;p.mp=Math.min(p.mmp,p.mp+dt*7*PB.mpr);
  const dx=(K.R?1:0)-(K.L?1:0),dy=(K.D?1:0)-(K.U?1:0);
  if(p.st==='hurt'){p.stun-=dt;p.x+=p.vx*dt;p.vx*=Math.exp(-9*dt);if(p.stun<=0)p.st='idle';return}
  if(p.st==='down'){p.t-=dt;p.x+=p.vx*dt;p.vx*=Math.exp(-6*dt);if(p.z>0){p.vz-=GRAV*dt;p.z=Math.max(0,p.z+p.vz*dt)}if(p.t<=0){p.st='getup';p.t=0.38;p.inv=0.9}return}
  if(p.st==='getup'){p.t-=dt;if(p.t<=0)p.st='idle';return}
  if(p.st==='back'){p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z=Math.max(0,Math.sin((1-p.t/0.3)*Math.PI)*8);if(Math.random()<0.6)imgs.push({x:p.x,y:p.y,z:p.z,face:p.face,move:'skS',mt:0.3,t:0.16,m:0.16});if(Math.random()<0.5)dust(p.x-p.face*14,p.y,1);if(p.t<=0){p.st='idle';p.z=0;p.vy=0}return}
  // airborne jump physics (not during scripted moves)
  if(p.st==='jump'){p.vz-=GRAV*dt;p.z+=p.vz*dt;p.x+=dx*210*dt;p.y+=dy*120*dt;if(dx)p.face=dx;
    if(buffered('X')&&p.airAtk<2){consume('X');p.airAtk++;startMove('air');return}
    if(buffered('Q',0.12)&&skillReady('skQ')){consume('Q');startMove('skQ');return}
    if(p.z<=0){p.z=0;p.vz=0;p.st='idle';p.airAtk=0;dust(p.x,p.y,4)}return}
  if(p.st==='move'){moveUpdate(dt);return}
  // ground control
  if(trySkill())return;
  if(buffered('X')){consume('X');startMove('a1');return}
  if(buffered('C',0.15)){consume('C');p.st='jump';p.vz=640;p.z=1;p.airAtk=0;sfx('dash');return}
  if(buffered('Z',0.15)){consume('Z');startDash();return}
  const running=runDir!==0&&dx===runDir;
  const sp=running?370:210;p.x+=dx*sp*dt;p.y+=dy*(running?150:125)*dt;if(dx)p.face=dx;
  p.st=(dx||dy)?(running?'run':'walk'):'idle';p.walk+=((dx||dy)?(running?17:11):0)*dt;
  if(running&&Math.random()<0.25)dust(p.x-p.face*10,p.y,1);
}
function moveUpdate(dt){
  const p=player,M=MOVES[p.move];const t0=p.mt;p.mt+=dt;const t=p.mt,dx=(K.R?1:0)-(K.L?1:0),dy=(K.D?1:0)-(K.U?1:0);
  if(M.push)for(const [a,b,v] of M.push)if(t>a&&t0<b)p.x+=p.face*v*Math.min(dt,b-t0,t-a);
  if(M.walk){p.x+=dx*M.walk*dt;p.y+=dy*90*dt}
  else if(!M.ult&&p.move!=='skS'&&p.move!=='skQ'&&p.move!=='skF'){const ga=p.z<2;p.x+=dx*(ga?120:150)*dt;p.y+=dy*85*dt}
  if(M.air||p.move==='air'){p.vz-=GRAV*0.55*dt;p.z=Math.max(0,p.z+p.vz*dt);p.x+=dx*120*dt}
  if(p.move==='skF'){const u=Math.min(1,t/0.43);p.z=p.slamZ0*(1-u)+Math.sin(u*Math.PI)*120*(1-u*0.15);if(t>=0.43)p.z=0;p.x+=p.face*90*dt*(t<0.43?1:0)}
  if(p.move==='skQ'){if(p.diveT>0){p.diveT-=dt;p.vz-=GRAV*dt;p.z=Math.max(1,p.z+p.vz*dt)}else{p.vz=-1300;p.z+=p.vz*dt;p.x+=p.face*230*dt;
      if(p.z<=0&&!p.diveHit){p.z=0;p.diveHit=true;p.mt=Math.max(p.mt,0.62);const QD=MOVES.skQ.dive2||{w:240,m:1},h={off:-QD.w/2,w:QD.w,dy:56,dmg:[440*QD.m,520*QD.m],stun:.6,kz:330,bounce:1,otg:1,hs:.1,big:1,zr:[-20,160]};
        for(const e of mons)if(canHit(e)&&overlaps(p,h,e))applyHit(e,h,p);ringFx(p.x,p.y,170,'255,200,120');crackFx(p.x,p.y);spr(3,p.x,p.y,40,{sc:0.75,t:0.35});spr(5,p.x-p.face*30,p.y,90,{face:p.face,sc:0.55,t:0.18});for(let i=0;i<10;i++)dust(p.x+rnd(-60,60),p.y,3);sfx('boom');shake=Math.max(shake,10)}}
    if(p.z>0&&p.mt>0.6&&!p.diveHit)p.mt=0.6}
  else p.diveHit=false;
  if(M.after&&Math.random()<0.6)imgs.push({x:p.x,y:p.y,z:p.z,face:p.face,move:p.move,mt:p.mt,t:0.22,m:0.22});
  // hits
  M.hits.forEach((h,i)=>{if(t>=h.t&&t0<h.t+h.d){for(const e of mons){if(!canHit(e)||p.hitSets[i].has(e))continue;if(overlaps(p,h,e)){p.hitSets[i].add(e);applyHit(e,h,p)}}}});
  if(p.move==='skF'&&t>=0.43&&t0<0.43){spr(3,p.x+p.face*30,p.y,55,{face:p.face,sc:1.25,t:0.5});ringFx(p.x,p.y,220,'255,190,90');crackFx(p.x,p.y);for(let i=0;i<14;i++)dust(p.x+rnd(-100,100),p.y,4);for(let i=0;i<10;i++)rock(p.x+rnd(-80,80),p.y);flash=0.08;flashCol='255,220,160'}
  if(M.wave&&t>=M.wave&&t0<M.wave)for(let wi=0;wi<(M.waves||1);wi++)shots.push({type:'wave',x:p.x+p.face*(50-wi*40),y:p.y,z:p.z+40+(wi?(wi%2?-34:34):0),vx:p.face*720,face:p.face,life:0.95+wi*0.06,hits:new Map(),own:'p',dm:M.wdm||1});
  if(M.ult)ultUpdate(t,t0);
  // chain / cancel
  if(M.next&&t>=M.combo&&buffered('X',0.3)){consume('X');startMove(M.next);return}
  if(p.move==='air'&&t>0.2&&buffered('X')&&p.airAtk<2){consume('X');p.airAtk++;startMove('air');return}
  const cancelAt=M.mp?Math.max(0.12,(M.hits[0]?M.hits[0].t+0.04:0.18)):0.08;
  if(t>=cancelAt&&!M.ult&&trySkill())return;
  if(t>=cancelAt&&!M.ult&&p.z<4&&buffered('Z',0.15)){consume('Z');startDash();return}
  if(t>=M.dur){p.move=null;if(p.z>2){p.st='jump';p.vz=Math.min(p.vz,0)}else{p.z=0;p.st='idle'}}
}
// ultimate: cut-in, then blink-slashes across every enemy on screen
function ultUpdate(t,t0){const p=player;
  if(t>=0.75&&t<1.6){const k=Math.floor((t-0.75)/0.085),k0=Math.floor((t0-0.75)/0.085);if(t0<0.75||k!==k0){
    const vis=mons.filter(e=>canHit(e)&&e.x>camX-40&&e.x<camX+W+40);
    for(const e of vis){{const u=DF().ult*(e.type==='boss'?0.6:1)*ULTM;applyHit(e,{dmg:[200*u,240*u],stun:.5,kz:e.z>1?200:0,hs:0.02},p,{ult:1})}if(vis.length)sfx('ult_slash');

const LOB={w:1600,h:901,fire:[0.344,0.75],tent:[0.2,0.55],drops:[]};
function rainLoop(t){requestAnimationFrame(rainLoop);const scr=curScr==='title'?SCR.title:curScr==='home'?SCR.home:null;if(!scr)return;
  const cvs=scr.querySelector('.rain'),W2=cvs.clientWidth,H2=cvs.clientHeight;if(!W2)return;const dpr=Math.min(2,devicePixelRatio||1);
  if(cvs.width!==Math.round(W2*dpr)||cvs.height!==Math.round(H2*dpr)){cvs.width=Math.round(W2*dpr);cvs.height=Math.round(H2*dpr)}
  const g=cvs.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W2,H2);
  const sc=Math.max(W2/LOB.w,H2/LOB.h),ox=(W2-LOB.w*sc)/2,oy=(H2-LOB.h*sc)/2,P=([x,y])=>[ox+x*LOB.w*sc,oy+y*LOB.h*sc];
  const dim=curScr==='home'?0.62:1,fl=0.75+0.25*Math.sin(t/90)*Math.sin(t/37)+0.1*Math.random();
  g.globalCompositeOperation='lighter';
  const [fx,fy]=P(LOB.fire),fr=H2*0.2*fl;let gr=g.createRadialGradient(fx,fy,1,fx,fy,fr);gr.addColorStop(0,`rgba(255,170,70,${0.42*dim})`);gr.addColorStop(.4,`rgba(255,90,20,${0.16*dim})`);gr.addColorStop(1,'rgba(255,60,0,0)');g.fillStyle=gr;g.fillRect(fx-fr,fy-fr,fr*2,fr*2);
  const [tx,ty]=P(LOB.tent),tr=H2*0.16;gr=g.createRadialGradient(tx,ty,1,tx,ty,tr);gr.addColorStop(0,`rgba(255,140,50,${0.1*fl*dim})`);gr.addColorStop(1,'rgba(255,100,20,0)');g.fillStyle=gr;g.fillRect(tx-tr,ty-tr,tr*2,tr*2);
  // embers rising from the fire
  if(!LOB.em)LOB.em=[];if(Math.random()<0.35)LOB.em.push({x:LOB.fire[0]+(Math.random()-.5)*0.01,y:LOB.fire[1]-0.02,vx:(Math.random()-.5)*0.0006,vy:-0.0012-Math.random()*0.001,l:1});
  for(const e of LOB.em){e.x+=e.vx+Math.sin(t/300+e.y*50)*0.0002;e.y+=e.vy;e.l-=0.012;const [x,y]=P([e.x,e.y]);g.fillStyle=`rgba(255,${150+Math.random()*60|0},60,${Math.max(0,e.l)*dim})`;g.fillRect(x,y,1.6,1.6)}
  LOB.em=LOB.em.filter(e=>e.l>0);
  // rain
  g.globalCompositeOperation='source-over';const n=Math.round(W2*H2/2600);while(LOB.drops.length<n)LOB.drops.push({x:Math.random(),y:Math.random(),v:0.9+Math.random()*0.8,z:Math.random()});
  g.lineCap='round';for(const d of LOB.drops){d.y+=0.018*d.v;d.x-=0.002*d.v;if(d.y>1.05){d.y=-0.05;d.x=Math.random()*1.1}const x=d.x*W2,y=d.y*H2,len=(8+d.z*16)*H2/540;
    g.strokeStyle=`rgba(190,200,230,${(0.12+d.z*0.22)})`;g.lineWidth=0.6+d.z*0.9;g.beginPath();g.moveTo(x,y);g.lineTo(x-len*0.12,y+len);g.stroke()}
  // occasional lightning
  if(!LOB.lt||t>LOB.lt){LOB.lt=t+6000+Math.random()*9000;LOB.fl=1}if(LOB.fl>0){g.fillStyle=`rgba(200,210,255,${LOB.fl*0.18*dim})`;g.fillRect(0,0,W2,H2);LOB.fl-=0.06}}
